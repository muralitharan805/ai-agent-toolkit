# ==============================================================================
# Local Development Overrides (Auto-merged by 'docker compose up')
# ==============================================================================
services:
  app:
    build:
      target: builder
    command: pnpm run start:dev
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${DEBUG_PORT:-9229}:9229"
