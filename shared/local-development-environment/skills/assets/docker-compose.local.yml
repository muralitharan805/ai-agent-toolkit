version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Local Development Stack Template
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   1. Copy .env.example → .env and fill in values
#   2. Run: ./scripts/setup-local.sh
#   OR:
#   docker compose up -d --wait
#
# Local Services Available After Startup:
#   App (dev)      http://localhost:3000
#   API Docs       http://localhost:3000/docs
#   PostgreSQL     postgresql://myapp:localpassword@localhost:5432/myapp_dev
#   Redis          redis://localhost:6379
#   RabbitMQ       amqp://myapp:localpassword@localhost:5672
#   RabbitMQ UI    http://localhost:15672  (myapp / localpassword)
#   Mailhog SMTP   smtp://localhost:1025  (no auth)
#   Mailhog UI     http://localhost:8025
#   Adminer DB UI  http://localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — Primary Relational Database
  # IMPORTANT: Credentials MUST match DATABASE_URL in .env.example
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine        # Pinned — never use 'latest'
    restart: unless-stopped
    environment:
      POSTGRES_USER: myapp           # ← Must match DATABASE_URL username in .env.example
      POSTGRES_PASSWORD: localpassword  # ← Must match DATABASE_URL password in .env.example
      POSTGRES_DB: myapp_dev         # ← Must match DATABASE_URL database name in .env.example
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # Redis 7 — Cache, Session Store, Rate Limiter, Distributed Lock
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine            # Pinned
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───────────────────────────────────────────────────────────────────────────
  # RabbitMQ 3 — Message Broker with Management UI
  # IMPORTANT: Credentials must match RABBITMQ_URL in .env.example
  # ───────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine  # Pinned with UI plugin
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: myapp        # ← Must match RABBITMQ_URL in .env.example
      RABBITMQ_DEFAULT_PASS: localpassword
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # Mailhog — SMTP Mail Catcher
  # All emails sent by the app are caught here — no real emails sent
  # UI: http://localhost:8025 | SMTP: localhost:1025 (no auth)
  # ───────────────────────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1    # Pinned
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    # No healthcheck needed — instant startup

  # ───────────────────────────────────────────────────────────────────────────
  # Adminer — Database Browser Web UI
  # Access: http://localhost:8080
  # Login: System=PostgreSQL, Server=postgres, User=myapp, Pass=localpassword, DB=myapp_dev
  # ───────────────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1             # Pinned
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
