name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    name: Core quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Validate Bash syntax
        run: bash -n bin/context.sh

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            bin \
            tests \
            tools

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate representative Agent Skill
        run: |
          # Smoke-test one real skill. Strict mode is intentionally deferred until
          # the existing catalog is fully warning-free.
          uv run tools/generators/generate-skill/skills/scripts/validate_skill.py \
            frameworks/angular/angular-enterprise-forms/skills
